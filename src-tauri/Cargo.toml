[package]
name = "project_navigator_desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.0", features = ["api-all"] }
rusqlite = { version = "0.30.1", features = ["bundled"] }
uuid = { version = "1.4.2", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
